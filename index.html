<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netify Warrior</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #1e3c72, #2a5298);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            width: 100%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        .frame-container {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Hide iframe initially */
        }

        .error-message {
            position: absolute;
            font-size: 1.5em;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
            display: none; /* Hide error message initially */
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌐 Netify Warrior 🌐</h1>
    </div>
    <div class="frame-container">
        <iframe id="iframe" src="https://www.google.com" frameborder="0"></iframe>
        <div class="error-message" id="error-message">KARMA REFUSED TO CONNECT</div>
    </div>

    <script>
        const iframe = document.getElementById('iframe');
        const errorMessage = document.getElementById('error-message');

        iframe.onload = function() {
            // Check if iframe has loaded successfully
            if (iframe.contentWindow.location.href === 'about:blank') {
                iframe.style.display = 'none';
                errorMessage.style.display = 'block';
            } else {
                iframe.style.display = 'block';
                errorMessage.style.display = 'none';
            }
        };

        iframe.onerror = function() {
            // Display error message if iframe fails to load
            iframe.style.display = 'none';
            errorMessage.style.display = 'block';
        };
    </script>
</body>
</html>
